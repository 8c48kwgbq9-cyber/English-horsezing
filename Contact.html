<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English with Horses - ติดต่อเรา</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #fdfbf7; color: #333; }
        header { background-color: #5D4037; color: white; padding: 20px; text-align: center; }
        nav { background-color: #8D6E63; display: flex; justify-content: center; padding: 10px; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
        nav a:hover { color: #D7CCC8; }
        .container { padding: 40px 20px; max-width: 800px; margin: 20px auto; background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #5D4037; }
        form { display: flex; flex-direction: column; }
        label { margin-top: 10px; font-weight: bold; }
        input, textarea { padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #5D4037; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; margin-top: 20px; font-size: 16px; }
        button:hover { background-color: #3E2723; }
    </style>
</head>
<body>

    <header>
        <h1>🐴 English with Horses</h1>
    </header>

    <nav>
        <a href="index.html">หน้าหลัก</a>
        <a href="about.html">เกี่ยวกับฉัน</a>
        <a href="content.html">เนื้อหา</a>
        <a href="activity.html">กิจกรรม</a>
        <a href="contact.html">ติดต่อ</a>
    </nav>

    <div class="container">
        <h2>ติดต่อเรา (Contact Form)</h2>
        <p>หากมีข้อสงสัยเกี่ยวกับบทเรียน สามารถกรอกฟอร์มด้านล่างได้เลยครับ</p>
        
        <form onsubmit="event.preventDefault(); alert('ขอบคุณที่ติดต่อเรา ระบบได้รับข้อความของคุณแล้ว');">
            <label for="name">ชื่อ-นามสกุล:</label>
            <input type="text" id="name" name="name" placeholder="ระบุชื่อของคุณ" required>

            <label for="email">อีเมล:</label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>

            <label for="message">ข้อความ / คำถาม:</label>
            <textarea id="message" name="message" rows="5" placeholder="พิมพ์ข้อความของคุณที่นี่..." required></textarea>

            <button type="submit">ส่งข้อความ</button>
        </form>
    </div>

</body>
</html>
